<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>piracy.ton - Decentralized TON Storage Files Indexer</title>
    <meta name="description" content="Decentralized file indexer for TON Storage. Search, share and download files on the TON blockchain network.">
    <meta name="keywords" content="TON, TON Storage, decentralized, file sharing, blockchain, bag ID, indexer">
    <meta property="og:title" content="piracy.ton - Decentralized TON Storage Files Indexer">
    <meta property="og:description" content="Decentralized file indexer for TON Storage. Search, share and download files on the TON blockchain network.">
    <meta property="og:image" content="/piracy.png">
    <meta property="og:type" content="website">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
    <header>
        <a href="/" class="logo"><img src="/piracy.png" alt="piracy" class="logo-img">piracy.ton</a>
        <div class="header-right">
            <button class="theme-toggle" id="theme-toggle" title="Toggle dark mode">
                <svg id="icon-moon" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
                <svg id="icon-sun" style="display:none" viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 0 0 0-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>
            </button>
            <a href="/add.html" data-i18n="add_bag">+ Add Bag</a>
        </div>
    </header>

    <main>
        <div class="hero">
            <img src="/piracy.png" alt="piracy" class="hero-img">
            <h1 class="hero-title" data-i18n="hero_title">Decentralized TON Storage Files Indexer</h1>
        </div>
        <div class="search-box">
            <input type="text" id="search" data-i18n-placeholder="search_placeholder" placeholder="Search bags...">
            <button type="button" id="search-btn" data-i18n="search_btn">Search</button>
        </div>

        <div class="categories">
            <div class="categories-pill">
                <label><input type="radio" name="cat" value="" checked><span data-i18n="cat_all">All</span></label>
                <label><input type="radio" name="cat" value="video"><span data-i18n="cat_video">Video</span></label>
                <label><input type="radio" name="cat" value="audio"><span data-i18n="cat_audio">Audio</span></label>
                <label><input type="radio" name="cat" value="apps"><span data-i18n="cat_apps">Apps</span></label>
                <label><input type="radio" name="cat" value="games"><span data-i18n="cat_games">Games</span></label>
                <label><input type="radio" name="cat" value="books"><span data-i18n="cat_books">Books</span></label>
                <label><input type="radio" name="cat" value="other"><span data-i18n="cat_other">Other</span></label>
            </div>
        </div>

        <div class="table-wrapper">
            <table id="bags-table">
                <thead>
                    <tr>
                        <th data-i18n="th_type">Type</th>
                        <th data-i18n="th_name">Name</th>
                        <th data-i18n="th_size">Size</th>
                        <th data-i18n="th_files">Files</th>
                        <th data-i18n="th_peers">Peers</th>
                        <th data-i18n="th_date">Date</th>
                        <th data-i18n="th_bagid">Bag ID</th>
                    </tr>
                </thead>
                <tbody id="bags-list">
                </tbody>
            </table>
        </div>
    </main>

    <footer>
        <a href="https://t.me/TONpiracy" target="_blank">@TONpiracy</a>
        <a href="/faq.html">F.A.Q</a>
    </footer>

    <script src="js/i18n.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
