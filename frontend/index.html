    <main>
        <div class="hero">
            <img src="/piracy.png" alt="piracy" class="hero-img">
            <h1 class="hero-title" data-i18n="hero_title">Decentralized TON Storage Files Indexer</h1>
        </div>
        <div class="search-box">
            <input type="text" id="search" data-i18n-placeholder="search_placeholder" placeholder="Search bags...">
            <button type="button" id="search-btn" data-i18n="search_btn">Search</button>
        </div>

        <div class="categories">
            <div class="categories-pill">
                <label><input type="radio" name="cat" value="" checked><span data-i18n="cat_all">All</span></label>
                <label><input type="radio" name="cat" value="video"><span data-i18n="cat_video">Video</span></label>
                <label><input type="radio" name="cat" value="audio"><span data-i18n="cat_audio">Audio</span></label>
                <label><input type="radio" name="cat" value="apps"><span data-i18n="cat_apps">Apps</span></label>
                <label><input type="radio" name="cat" value="games"><span data-i18n="cat_games">Games</span></label>
                <label><input type="radio" name="cat" value="books"><span data-i18n="cat_books">Books</span></label>
                <label><input type="radio" name="cat" value="other"><span data-i18n="cat_other">Other</span></label>
            </div>
        </div>

        <div class="table-wrapper">
            <table id="bags-table">
                <thead>
                    <tr>
                        <th data-i18n="th_type">Type</th>
                        <th data-i18n="th_name">Name</th>
                        <th data-i18n="th_size">Size</th>
                        <th data-i18n="th_files">Files</th>
                        <th data-i18n="th_peers">Peers</th>
                        <th data-i18n="th_date">Date</th>
                        <th data-i18n="th_bagid">Bag ID</th>
                    </tr>
                </thead>
                <tbody id="bags-list">
                </tbody>
            </table>
        </div>
        <nav class="catalog-pagination" id="catalog-pagination" aria-label="Pagination" hidden>
            <button type="button" id="previous-page" data-i18n="pagination_previous" disabled>Previous</button>
            <span id="page-status" aria-live="polite"></span>
            <button type="button" id="next-page" data-i18n="pagination_next" disabled>Next</button>
        </nav>
    </main>

    <footer class="app-footer">
        <div class="app-footer-inner">
            <a class="app-footer-ton" href="https://ton.org" target="_blank" rel="noreferrer noopener" aria-label="The Open Network">
